<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - File Drop</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <main class="card">
        <h1 id="authTitle">Sign in to File Drop</h1>
        <p>Create a local account to choose the username others will use to send files to you.</p>
        <form class="auth-form" id="authForm">
            <label for="username">Username</label>
            <input type="text" id="username" minlength="3" maxlength="24" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" minlength="4" autocomplete="current-password" required>
            <button class="btn" id="submitButton" type="submit">Sign In</button>
            <p class="auth-toggle" id="authToggle">Need an account? Create one</p>
        </form>
    </main>
    <script src="signin.js"></script>
</body>
</html>
